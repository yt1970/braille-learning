<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>点字を学ぼう</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <h1 class="app-title">点字を学ぼう</h1>

  <!-- #28: メニュー画面 -->
  <div id="menu-screen" class="menu-screen">
    <div class="menu-section">
      <div class="menu-section-title">📖 モードを選ぶ</div>
      <div class="menu-btn-group">
        <button class="menu-mode-btn active" data-mode="read">👁 読む</button>
        <button class="menu-mode-btn" data-mode="type">✋ 打つ</button>
      </div>
    </div>
    <div class="menu-section">
      <div class="menu-section-title">🎯 レベルを選ぶ</div>
      <div class="menu-btn-group menu-level-group">
        <button class="menu-level-btn active" data-level="shokyu">初級<span class="menu-level-sub">清音・濁音・拗音</span></button>
        <button class="menu-level-btn" data-level="chukyu">中級<span class="menu-level-sub">単語90語</span></button>
        <button class="menu-level-btn" data-level="idiom">四字熟語<span class="menu-level-sub">80語</span></button>
        <button class="menu-level-btn" data-level="number">数字<span class="menu-level-sub">0〜9の点字</span></button>
        <button class="menu-level-btn" data-level="kigo">記号<span class="menu-level-sub">句読点・括弧など</span></button>
        <button class="menu-level-btn" data-level="alpha">アルファベット<span class="menu-level-sub">A〜Z 単字</span></button>
        <button class="menu-level-btn" data-level="kanji_idiom">漢数字熟語<span class="menu-level-sub">漢数字入り四字熟語</span></button>
      </div>
    </div>
    <button class="btn-start" id="btn-start">スタート ▶</button>
  </div>

  <!-- #28: 出題画面 -->
  <div id="quiz-screen" class="quiz-screen hidden">
    <div class="quiz-header">
      <button class="btn-back-menu" id="btn-back-menu">← メニュー</button>
      <span class="quiz-mode-badge" id="quiz-mode-label">👁 読むモード</span>
      <span class="quiz-level-badge" id="quiz-level-label">初級</span>
    </div>

    <div class="content">
      <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>

      <div class="card" id="card">
        <div class="card-tag" id="card-tag">点字</div>

        <!-- 読むモード: 点字表示 -->
        <div class="braille-wrapper" id="braille-wrapper">
          <div class="braille-row" id="braille-display"></div>
          <div class="scroll-indicator hidden" id="scroll-indicator">右へスクロール ➔</div>
        </div>

        <!-- 読むモード: 入力欄 + 確認ボタン（カード内下部中央） -->
        <div class="input-area" id="input-area" style="display:none">
          <div class="input-row">
            <input type="text" id="answer-input" class="answer-input" placeholder="" autocomplete="off" autocapitalize="none">
          </div>
          <div class="input-check-row">
            <button class="btn-check" id="btn-check" onclick="checkAnswer()">確認 ✓</button>
          </div>
        </div>

        <!-- 打つモード: 文字表示 -->
        <div class="typing-char hidden" id="typing-char"></div>
        <div class="card-sub" id="card-sub"></div>
      </div>

      <!-- 打つモード: 点字入力エリア -->
      <div class="typing-area hidden" id="typing-area">
        <div class="typing-dir">
          <span class="typing-dir-arrow">←</span> 右から左に打ちます
        </div>
        <div class="typing-cells-row" id="typing-cells"></div>
        <button class="btn-check" onclick="checkAnswer()">確認 ✓</button>
      </div>

      <!-- 正誤フィードバック -->
      <div class="feedback hidden" id="feedback">
        <div class="feedback-icon" id="feedback-icon"></div>
        <div class="feedback-msg" id="feedback-msg"></div>
        <div class="feedback-correct" id="feedback-correct"></div>
        <div class="feedback-braille braille-row" id="feedback-braille"></div>
        <div class="mascot" id="mascot"></div>
      </div>

      <!-- 結果画面 -->
      <div class="result hidden" id="result">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <div class="result-title" id="result-title">おつかれさま！</div>
        <div class="result-sub" id="result-sub"></div>
        <div class="result-score-wrap">
          <div class="result-score" id="result-score">0%</div>
          <div class="result-score-label">正解率</div>
        </div>
        <div class="result-btns">
          <button class="btn btn-retry" onclick="restart(false)">もう一度</button>
          <button class="btn btn-wrong-only" onclick="restart(true)">不正解のみ</button>
          <button class="btn btn-menu" onclick="showMenu()">メニューへ</button>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="stat-cur">1</div><div class="stat-label">現在</div></div>
        <div class="stat"><div class="stat-num correct" id="stat-right">0</div><div class="stat-label">正解</div></div>
        <div class="stat"><div class="stat-num wrong" id="stat-wrong">0</div><div class="stat-label">不正解</div></div>
      </div>
      <div class="btn-row" id="btn-next-row" style="display:none">
        <button class="btn btn-next" onclick="nextCard()">次へ →</button>
      </div>
    </div>
  </div>
</div>

<script src="./braille_data.js"></script>
<script src="./app.js"></script>
</body>
</html>
